# ---------------------------------------------------------------------------
# Verde — stack para o plugin Compose do OMV (Web UI).
#
# Pasta do stack: \\ORANGEPI3B\apps\compose\verde
# (= /srv/<disco>/apps/compose/verde no servidor)
#
# Aqui NÃO existe build: a imagem é construída no GitHub Actions
# (.github/workflows/docker-publish.yml, linux/arm64) e publicada no GHCR.
# Esta pasta só guarda o YAML e o verde.env — por isso o erro
# "failed to read dockerfile: open Dockerfile" deixa de acontecer.
#
# No servidor (como root, uma vez), se o pacote do GHCR ficar privado:
#   docker login ghcr.io -u tiago-txt -p <PAT com read:packages>
# ou torne o pacote público:
#   https://github.com/users/tiago-txt/packages/container/verde/settings
# ---------------------------------------------------------------------------
services:
  verde:
    image: ghcr.io/tiago-txt/verde:latest
    container_name: verde
    restart: unless-stopped
    # Sempre busca a imagem mais nova ao subir (botão Up).
    pull_policy: always
    # Arquivo criado na aba "Environment Files" do plugin, nesta mesma pasta.
    env_file:
      - verde.env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3200}
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-America/Sao_Paulo}
      # Caminho DENTRO do container (o bind mount abaixo aponta para /app/data).
      DATABASE_PATH: /app/data/verde.db
    ports:
      - "${PORT:-3200}:${PORT:-3200}"
    volumes:
      # Dados em \\ORANGEPI3B\apps\data\verde
      # (`../../data/verde` é relativo a esta pasta: apps/compose/verde).
      # Quer os dados ao lado do YAML? Troque por ./data.
      - ../../data/verde:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${PORT:-3200}/api/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # O watchtower só mexe em containers com este label.
      com.centurylinklabs.watchtower.enable: "true"

  # -------------------------------------------------------------------------
  # Atualização automática: quando o Actions publica uma imagem nova, o
  # watchtower (a cada 15 min) puxa e recria o container.
  # Se não quiser, apague este serviço e atualize no botão Up.
  #
  # Montar o docker.sock dá poder de root ao container — é o preço da
  # auto-atualização.
  # -------------------------------------------------------------------------
  watchtower:
    # Fork mantido do containrrr/watchtower (o 1.7.1 original fala API Docker
    # 1.25 e o daemon atual recusa: "client version 1.25 is too old").
    image: nickfedor/watchtower:1.24.0
    container_name: verde-watchtower
    restart: unless-stopped
    command: --label-enable --cleanup --rolling-restart --interval 900
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Diretório (e não o arquivo): se config.json não existir, o Docker
      # criaria uma pasta vazia no lugar dele e o watchtower quebraria.
      - /root/.docker:/root/.docker:ro
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
