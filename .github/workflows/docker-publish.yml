name: docker-publish

# Builda a imagem no GitHub e publica no GHCR.
# Pull requests apenas constroem a variante amd64 (sem push).
# Push na main/tags publica as variantes amd64 e arm64 em runners nativos.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentação e YAML de deploy não mudam a imagem.
    paths-ignore:
      - "**/*.md"
      - "docker-compose*.yml"
      - ".gitattributes"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docker-compose*.yml"
      - ".gitattributes"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  # PR: valida a imagem amd64 sem publicar e sem passar pelo QEMU.
  build-pr:
    name: Build PR (amd64)
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=verde-pr
          cache-to: type=gha,mode=max,scope=verde-pr

  # Main/tags: cada arquitetura no seu runner nativo. Isso evita o SIGILL do
  # Next/SWC quando o arm64 é emulado pelo QEMU.
  build:
    name: Build ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            # Runner ARM64 nativo do GitHub. Se o repositório não tiver acesso,
            # troque por [self-hosted, linux, arm64].
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push por digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=verde-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=verde-${{ matrix.arch }}

      - name: Exportar digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Guardar digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Junta os dois digests em um único manifesto multi-arch com as tags.
  merge:
    name: Publicar manifesto
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=ref,event=pr

      - name: Baixar digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Criar manifesto
        run: |
          cd /tmp/digests
          tags=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed '/^$/d' | sed 's/^/-t /' | tr '\n' ' ')
          digests=$(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools create $tags $digests
