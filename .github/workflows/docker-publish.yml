name: docker-publish

# Builda a imagem no GitHub e publica no GHCR.
# Pull requests apenas constroem (sem push); pushes na main/tags publicam.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentação e YAML de deploy não mudam a imagem.
    paths-ignore:
      - "**/*.md"
      - "docker-compose*.yml"
      - ".gitattributes"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docker-compose*.yml"
      - ".gitattributes"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

  build:
    name: Build e publicação
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # O servidor é um Orange Pi 3B (ARM64) e também queremos rodar em x86_64.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=ref,event=pr

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs apenas constroem; nunca publicam.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
