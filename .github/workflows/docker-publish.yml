name: docker-publish

# Builda a imagem no GitHub e publica no GHCR.
# No servidor o compose só faz `pull` — nenhum arquivo do projeto precisa
# existir na pasta do plugin Compose do OMV.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # O servidor é um Orange Pi 3B (ARM64/aarch64). Como o runner do GitHub é
      # x86_64, o QEMU emula o arm64 durante o build (~10-20 min).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Orange Pi 3B (RK3566) = arm64. Para também rodar em PC x86_64,
          # troque por: platforms: linux/arm64,linux/amd64
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
