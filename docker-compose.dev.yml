# ---------------------------------------------------------------------------
# Verde — build local da imagem (desenvolvimento/teste).
#
# Uso:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Para produção, use docker-compose.yml (imagem do GHCR).
# ---------------------------------------------------------------------------
services:
  verde:
    build:
      context: .
      dockerfile: Dockerfile
    image: verde:dev
    container_name: verde-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_PATH: /app/data/verde.db
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${VERDE_DATA_DIR:-./data}:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${PORT:-3000}/api/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
